<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="100%" height="100%">
  <defs>
    <clipPath id="venn-v6-logo-clip">
      <circle cx="95" cy="120" r="70" />
    </clipPath>
  </defs>

  <g id="venn-mark">
    <!-- Left Circle: Vibrant Cyber Sky Blue -->
    <circle cx="95" cy="120" r="70" fill="#38BDF8" />

    <!-- Right Circle: Vibrant Mint / Neon Emerald -->
    <circle cx="165" cy="120" r="70" fill="#34D399" />

    <!-- Overlap Intersection: Inverted Brilliant White Lens -->
    <circle cx="165" cy="120" r="70" clip-path="url(#venn-v6-logo-clip)" fill="#FFFFFF" />

    <!-- Google Material Symbols Home (Pitch Black / Dark Obsidian) -->
    <g transform="translate(103.6, 93.6) scale(2.2)">
      <path fill="#020617" d="M10 19v-5h4v5c0 .55.45 1 1 1h3c.55 0 1-.45 1-1v-7h1.7c.46 0 .68-.57.33-.87L12.67 3.6c-.38-.34-.96-.34-1.34 0l-8.36 7.53c-.35.3-.13.87.33.87H5v7c0 .55.45 1 1 1h3c.55 0 1-.45 1-1z" />
    </g>
  </g>

  <!-- Typography -->
  <g id="venn-typography" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
    <!-- Brand Name -->
    <text
      x="264"
      y="132"
      font-size="88"
      font-weight="800"
      letter-spacing="-2px"
      fill="#0F172A"
    >Venn</text>

    <!-- Tagline -->
    <text
      x="266"
      y="174"
      font-size="24"
      font-weight="500"
