<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="100%" height="100%" fill="none">
  <defs>
    <clipPath id="venn-logo-clip">
      <circle cx="58" cy="54" r="26" />
    </clipPath>
  </defs>

  <g id="venn-mark" transform="translate(6, -5) scale(1.5)">
    <!-- Left Circle: Google Blue -->
    <circle cx="42" cy="54" r="26" fill="#4285F4" />

    <!-- Right Circle: Google Green -->
    <circle cx="58" cy="54" r="26" fill="#34A853" />

    <!-- Overlap Intersection: Teal Lens -->
    <circle cx="42" cy="54" r="26" clip-path="url(#venn-logo-clip)" fill="#00897B" />

    <!-- Classic Pin: 2/3 Depth Anchor with 2.2px Chiseled Border -->
    <path
      d="M 50 62 C 43 53, 35 45, 35 36 A 15 15 0 1 1 65 36 C 65 45, 57 53, 50 62 Z"
      fill="#EA4335"
      stroke="#FFFFFF"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <!-- Simplified Monolith House with Portal Notch -->
    <path
      d="M 42 42 L 42 36 L 50 28 L 58 36 L 58 42 H 53 V 38 H 47 V 42 Z"
      fill="#FFFFFF"
    />
  </g>

  <style>
    .venn-brand-text {
      fill: #1F1F1F;
    }
    @media (prefers-color-scheme: dark) {
      .venn-brand-text {
        fill: #F1F3F4;
      }
    }
  </style>

  <!-- Typography -->
  <text
    x="160"
    y="93"
    class="venn-brand-text"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif"
    font-size="74"
    font-weight="600"
    letter-spacing="-1.5px"
  >Venn</text>
</svg>
