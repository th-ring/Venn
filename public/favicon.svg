<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <clipPath id="venn-fav-clip">
      <circle cx="58" cy="54" r="26" />
    </clipPath>
  </defs>

  <!-- Left Circle: Google Blue -->
  <circle cx="42" cy="54" r="26" fill="#4285F4" />

  <!-- Right Circle: Google Green -->
  <circle cx="58" cy="54" r="26" fill="#34A853" />

  <!-- Overlap Intersection: Google Teal Lens -->
